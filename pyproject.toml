[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radrub"
version = "1.1.1"
description = "Professional Async/Sync Python framework for the Rubika Bot API v3 – complete method coverage, polling, webhook, keypads, filters, storage."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "RadRub Contributors"}]
keywords = ["rubika", "bot", "api", "telegram-like", "async"]
dependencies = ["httpx>=0.27,<1"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.10"]
webhook = ["aiohttp>=3.9"]
yaml = ["PyYAML>=6"]

[project.urls]
Documentation = "https://rubika.ir/botapi"

[tool.setuptools.packages.find]
where = ["."]
include = ["radrub*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
